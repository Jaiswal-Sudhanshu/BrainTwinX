# ===========================================================================
# BrainTwinX Backend — base configuration
# ===========================================================================
# Values are supplied by environment variables with no baked-in secrets.
# Any placeholder that must be overridden has NO default, so the application
# fails fast at startup rather than running with an insecure fallback.
# ===========================================================================

spring:
  application:
    name: braintwinx-backend

  # --- Datasource ---------------------------------------------------------
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:braintwinx}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: braintwinx-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      # Fail a leaked connection loudly instead of exhausting the pool silently.
      leak-detection-threshold: 30000

  # --- JPA / Hibernate ----------------------------------------------------
  jpa:
    open-in-view: false          # avoids lazy-loading in the view layer
    hibernate:
      # Flyway owns the schema. `validate` makes the application refuse to
      # start when entities and migrations disagree, rather than silently
      # mutating a medical database. Never set this to `update` or `create`.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        # Surfaces accidental N+1 access during development and tests.
        query:
          fail_on_pagination_over_collection_fetch: true

  # --- Flyway -------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # A checksum mismatch means an already-applied migration was edited.
    # Refuse to proceed rather than diverge from the recorded history.
    validate-on-migrate: true
    clean-disabled: true         # `flyway clean` must never be reachable

  # --- Uploads ------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE_BYTES:52428800}
      max-request-size: ${MAX_UPLOAD_SIZE_BYTES:52428800}

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true   # reject unexpected request fields

# --- Server ---------------------------------------------------------------
server:
  port: ${BACKEND_PORT:8080}
  error:
    # Never leak internals to clients (brief section 19). Errors are rendered
    # by the centralised exception handler instead.
    include-stacktrace: never
    include-message: never
    include-exception: false
  # Do not advertise the server implementation.
  server-header:

# --- Actuator -------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # Only health is exposed. Metrics and env are opened deliberately per
        # environment, never by default.
        include: health
  endpoint:
    health:
      probes:
        enabled: true            # provides liveness and readiness groups
      show-details: never        # details can disclose infrastructure
  health:
    db:
      enabled: true

# ===========================================================================
# BrainTwinX application settings
# ===========================================================================
braintwinx:

  storage:
    root: ${STORAGE_ROOT:./storage}
    max-upload-size-bytes: ${MAX_UPLOAD_SIZE_BYTES:52428800}
    # Decompression-bomb guard: refuse an image whose declared pixel count
    # exceeds this before attempting a full decode.
    max-image-pixels: ${MAX_IMAGE_PIXELS:40000000}

  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:30000}
    api-key: ${AI_SERVICE_API_KEY:}

  longitudinal:
    # Below either threshold the system returns INSUFFICIENT_HISTORY and
    # produces no trend estimate. These are DOMAIN settings and should be
    # reviewed by a qualified professional (ASSUMPTIONS.md A-5).
    min-observations: ${LONGITUDINAL_MIN_OBSERVATIONS:3}
    min-span-days: ${LONGITUDINAL_MIN_SPAN_DAYS:30}

  explanation:
    # Fails closed. When disabled, analysis and reporting still complete and
    # the explanation section is marked "Not available" (ASSUMPTIONS.md A-3).
    enabled: ${EXPLANATION_ENABLED:false}
    provider: ${EXPLANATION_PROVIDER:}
    model: ${EXPLANATION_MODEL:}
    api-key: ${EXPLANATION_API_KEY:}
    timeout-ms: ${EXPLANATION_TIMEOUT_MS:20000}

# --- Logging --------------------------------------------------------------
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.braintwinx: ${LOG_LEVEL:INFO}
  pattern:
    # traceId correlates application logs with audit_logs.trace_id.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
