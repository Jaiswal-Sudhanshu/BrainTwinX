# ===========================================================================
# Production profile
# ===========================================================================
# Secure by default. Every value that could leak information or weaken a
# safety guarantee is pinned closed here, so a missing environment variable
# degrades toward safety rather than away from it.
# ===========================================================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    clean-disabled: true

  # No stack traces, messages, or exception classes to clients.
  mvc:
    log-resolved-exception: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
  server-header:
  # Behind a load balancer / reverse proxy in production.
  forward-headers-strategy: native
  tomcat:
    # Bound request-line and header sizes as a cheap abuse guard.
    max-http-request-header-size: 16KB

logging:
  level:
    root: WARN
    com.braintwinx: INFO
    # SQL logging is prohibited in production: bind parameters can contain
    # patient data.
    org.hibernate.SQL: 'OFF'
    org.hibernate.orm.jdbc.bind: 'OFF'
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        # Health only. Metrics and environment endpoints are not exposed
        # publicly; scrape them over an internal channel if needed.
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

braintwinx:
  cors:
    # No default. An unset value must fail startup rather than silently
    # permit an unintended origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  ai:
    # SAFETY: synthetic inference is structurally impossible in production.
    # A startup validator rejects the production profile if stub inference is
    # enabled anywhere in the configuration chain.
    allow-stub-inference: false
