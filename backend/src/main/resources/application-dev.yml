# ===========================================================================
# Development profile
# ===========================================================================
# Convenience only. Nothing here may weaken a medical-safety or security
# invariant — it exists to make local work practical, not permissive.
# ===========================================================================

spring:
  jpa:
    # Still `validate`, even in dev. Allowing Hibernate to mutate the schema
    # locally would let entity/migration drift go unnoticed until it reached
    # an environment where it mattered.
    hibernate:
      ddl-auto: validate
    show-sql: ${LOG_SQL:false}
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.braintwinx: DEBUG
    # Enabled only when LOG_SQL=true is set explicitly.
    org.hibernate.SQL: ${LOG_SQL_LEVEL:WARN}
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

braintwinx:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
